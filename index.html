<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#05070b" />
    <meta
      name="description"
      content="EnergyOS, plataforma IoT de monitoramento energetico em tempo real com ESP32, PZEM-004T, MQTT e InfluxDB."
    />
    <title>EnergyOS | Monitoramento Energetico IoT</title>
    <style>
      body {
        margin: 0;
        background: #05070b;
      }

      .boot-fallback {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        color: #f8fafc;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .boot-fallback article {
        width: min(560px, 100%);
        border: 1px solid rgba(148, 163, 184, 0.18);
        border-radius: 8px;
        padding: 24px;
        background: linear-gradient(145deg, rgba(15, 23, 42, 0.92), rgba(6, 12, 20, 0.94));
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.38);
      }

      .boot-fallback strong {
        color: #facc15;
      }

      .boot-fallback code {
        display: block;
        margin-top: 12px;
        border-radius: 8px;
        padding: 12px;
        color: #cbd5e1;
        background: rgba(2, 6, 23, 0.7);
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-fallback">
        <article>
          <strong>EnergyOS esta pronto para iniciar.</strong>
          <p>Este frontend e uma aplicacao React/Vite e precisa ser aberto pelo servidor de desenvolvimento.</p>
          <code>cd web
npm install
npm run dev</code>
        </article>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
